document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});$('#md').addEventListener('click',e=>{if(e.target.id=='md')closeM()});
addEventListener('pointermove',e=>$('#whale').style.setProperty('--py',(e.clientY/innerHeight).toFixed(2)));
const NV=[['ini','Início','🏠'],['cal','Calendário','🗓️'],['hor','Horários','⏰'],['evt','Eventos','📌'],['pro','Progresso','🐳'],['not','Avisos','🔔'],['aju','Ajustes','⚙️']];
function go(v){if(v!=V){V=v;cross()}render();scrollTo(0,0)}
function render(){$('#nav').innerHTML=NV.map(n=>`<button class="${V==n[0]?'on':''}" onclick="go('${n[0]}')" aria-label="${n[1]}" ${V==n[0]?'aria-current="page"':''}><i>${n[2]}</i>${n[1]}</button>`).join('');$('#v').innerHTML={ini,cal,hor,evt,pro,not,aju}[V]();tick()}
function tick(){const n=new Date();$('#clk').innerHTML=`<b>${Z(n.getHours())}:${Z(n.getMinutes())}:${Z(n.getSeconds())}</b>${n.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}`;const c=$('#cdn');if(c){let s=Math.max(0,Math.floor((+c.dataset.t-Date.now())/1000));c.innerHTML=[[Math.floor(s/86400),'dias'],[Math.floor(s%86400/3600),'horas'],[Math.floor(s%3600/60),'min'],[s%60,'seg']].map(x=>`<div><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}}
for(let i=0;i<16;i++){const b=document.createElement('i'),s=6+Math.random()*18;b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${12+Math.random()*16}s;animation-delay:-${Math.random()*20}s`;$('#sea').appendChild(b)}
